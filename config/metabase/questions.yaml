# config/metabase/questions.yaml
# Source of truth for all Metabase saved questions.
# SQL must match docs/03-questions.md exactly.
# All questions live under parent collection "Northwind".

questions:

  # ── Sales ──────────────────────────────────────────────────────────

  - name: "Sales — Revenue by Month"
    collection: "Sales"
    display: "line"
    visualization_settings:
      graph.x_axis.title_text: "Month"
      graph.y_axis.title_text: "Revenue (USD)"
    sql: |
      SELECT
          order_year,
          order_month,
          order_month_name,
          SUM(net_amount) AS total_revenue,
          COUNT(DISTINCT order_id) AS order_count
      FROM analytics_marts.mart_sales_wide
      GROUP BY order_year, order_month, order_month_name
      ORDER BY order_year, order_month

  - name: "Sales — Revenue by Category"
    collection: "Sales"
    display: "bar"
    visualization_settings:
      graph.x_axis.title_text: "Revenue (USD)"
      graph.y_axis.title_text: "Category"
    sql: |
      SELECT
          category_name,
          SUM(net_amount)      AS total_revenue,
          SUM(quantity)        AS total_units,
          COUNT(DISTINCT order_id) AS order_count,
          ROUND(AVG(discount) * 100, 1) AS avg_discount_pct
      FROM analytics_marts.mart_sales_wide
      GROUP BY category_name
      ORDER BY total_revenue DESC

  - name: "Sales — Top 10 Customers"
    collection: "Sales"
    display: "table"
    visualization_settings: {}
    sql: |
      SELECT
          customer_code,
          customer_name,
          customer_country,
          SUM(net_amount)          AS total_revenue,
          COUNT(DISTINCT order_id) AS order_count,
          ROUND(SUM(net_amount) / COUNT(DISTINCT order_id), 2) AS avg_order_value
      FROM analytics_marts.mart_sales_wide
      GROUP BY customer_code, customer_name, customer_country
      ORDER BY total_revenue DESC
      LIMIT 10

  - name: "Sales — Sales by Quarter"
    collection: "Sales"
    display: "bar"
    visualization_settings:
      graph.x_axis.title_text: "Quarter"
      graph.y_axis.title_text: "Revenue (USD)"
    sql: |
      SELECT
          order_year,
          order_quarter,
          CONCAT(order_year, ' Q', order_quarter) AS quarter_label,
          SUM(net_amount) AS total_revenue
      FROM analytics_marts.mart_sales_wide
      GROUP BY order_year, order_quarter
      ORDER BY order_year, order_quarter

  - name: "Sales — Average Order Value"
    collection: "Sales"
    display: "line"
    visualization_settings:
      graph.x_axis.title_text: "Month"
      graph.y_axis.title_text: "Avg Order Value (USD)"
    sql: |
      SELECT
          order_year,
          order_month,
          order_month_name,
          ROUND(SUM(net_amount) / COUNT(DISTINCT order_id), 2) AS avg_order_value,
          COUNT(DISTINCT order_id) AS order_count
      FROM analytics_marts.mart_sales_wide
      GROUP BY order_year, order_month, order_month_name
      ORDER BY order_year, order_month

  # ── Products ───────────────────────────────────────────────────────

  - name: "Products — Top 10 by Revenue"
    collection: "Products"
    display: "table"
    visualization_settings: {}
    sql: |
      SELECT
          product_name,
          category_name,
          SUM(quantity)       AS total_units,
          SUM(net_amount)     AS total_revenue,
          ROUND(AVG(unit_price), 2) AS avg_price,
          ROUND(AVG(discount) * 100, 1) AS avg_discount_pct
      FROM analytics_marts.mart_sales_wide
      GROUP BY product_name, category_name
      ORDER BY total_revenue DESC
      LIMIT 10

  - name: "Products — Category Distribution"
    collection: "Products"
    display: "pie"
    visualization_settings: {}
    sql: |
      SELECT
          category_name,
          SUM(net_amount) AS revenue,
          ROUND(SUM(net_amount) * 100.0 / SUM(SUM(net_amount)) OVER (), 1) AS pct
      FROM analytics_marts.mart_sales_wide
      GROUP BY category_name
      ORDER BY revenue DESC

  - name: "Products — Discount Analysis"
    collection: "Products"
    display: "table"
    visualization_settings: {}
    sql: |
      SELECT
          category_name,
          ROUND(AVG(discount) * 100, 1)   AS avg_discount_pct,
          ROUND(MIN(discount) * 100, 1)   AS min_discount_pct,
          ROUND(MAX(discount) * 100, 1)   AS max_discount_pct,
          SUM(net_amount)                  AS total_revenue,
          SUM(quantity * unit_price) - SUM(net_amount) AS total_discount_given
      FROM analytics_marts.mart_sales_wide
      GROUP BY category_name
      ORDER BY avg_discount_pct DESC

  # ── Geography ──────────────────────────────────────────────────────

  - name: "Geography — Revenue by Country"
    collection: "Geography"
    display: "map"
    visualization_settings:
      map.type: "region"
      map.region: "world_countries"
    sql: |
      SELECT
          customer_country         AS country_code,
          customer_country_name    AS country,
          customer_region          AS region,
          SUM(net_amount)          AS total_revenue,
          COUNT(DISTINCT order_id) AS order_count
      FROM analytics_marts.mart_sales_wide
      GROUP BY customer_country, customer_country_name, customer_region
      ORDER BY total_revenue DESC

  - name: "Geography — Revenue by Region"
    collection: "Geography"
    display: "bar"
    visualization_settings:
      graph.x_axis.title_text: "Region"
      graph.y_axis.title_text: "Revenue (USD)"
    sql: |
      SELECT
          customer_region,
          SUM(net_amount)          AS total_revenue,
          COUNT(DISTINCT order_id) AS order_count,
          COUNT(DISTINCT customer_code) AS unique_customers
      FROM analytics_marts.mart_sales_wide
      GROUP BY customer_region
      ORDER BY total_revenue DESC

  # ── Employees ──────────────────────────────────────────────────────

  - name: "Employees — Sales Rep Performance"
    collection: "Employees"
    display: "table"
    visualization_settings: {}
    sql: |
      SELECT
          employee_name,
          employee_title,
          COUNT(DISTINCT order_id) AS order_count,
          SUM(net_amount)          AS total_revenue,
          ROUND(SUM(net_amount) / COUNT(DISTINCT order_id), 2) AS avg_order_value,
          COUNT(DISTINCT customer_code) AS unique_customers
      FROM analytics_marts.mart_sales_wide
      GROUP BY employee_name, employee_title
      ORDER BY total_revenue DESC

  # ── Operations ─────────────────────────────────────────────────────

  - name: "Operations — ETL Pipeline Health"
    collection: "Operations"
    display: "table"
    visualization_settings: {}
    sql: |
      SELECT
          batch_id,
          status,
          started_at,
          ended_at,
          ROUND(EXTRACT(EPOCH FROM (ended_at - started_at)), 1) AS duration_sec,
          rows_extracted,
          rows_loaded,
          rows_rejected,
          error_summary
      FROM metadata.etl_runs
      ORDER BY started_at DESC
      LIMIT 20

  - name: "Operations — Shipping Time Analysis"
    collection: "Operations"
    display: "table"
    visualization_settings: {}
    sql: |
      SELECT
          s.company_name AS shipper_name,
          AVG(
              CASE
                  WHEN shipped_date_sk IS NOT NULL AND shipped_date_sk != 19000101
                  THEN (
                      SELECT EXTRACT(DAY FROM (s_date.full_date - o_date.full_date))
                      FROM warehouse.dim_date s_date, warehouse.dim_date o_date
                      WHERE s_date.date_sk = f.shipped_date_sk
                        AND o_date.date_sk = f.order_date_sk
                  )
              END
          ) AS avg_shipping_days,
          COUNT(DISTINCT f.order_id) AS order_count
      FROM warehouse.fact_sales f
      JOIN warehouse.dim_shipper s ON f.shipper_sk = s.shipper_sk
      WHERE s.shipper_sk != -1
      GROUP BY s.company_name
