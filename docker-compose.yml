version: "3.9"

# ============================================================
#  Northwind Analytics — Metabase Stack
#
#  Metabase chạy độc lập, kết nối tới PostgreSQL của ETL repo.
#  Hai cách kết nối (chọn 1 trong setup wizard):
#
#  Option A (KHUYẾN NGHỊ): Shared Docker network
#    - Host: etl_postgres
#    - Cần ETL repo đang chạy (network etl_network exists)
#
#  Option B (Đơn giản hơn): Host network
#    - Host: host.docker.internal
#    - Postgres expose port 5432 ra host (đã có sẵn)
#    - Hoạt động kể cả Postgres KHÔNG chạy trong Docker
# ============================================================

services:

  metabase:
    image: metabase/metabase:v0.50.20
    container_name: northwind_metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - metabase_data:/metabase-data
    networks:
      - analytics_net
      - etl_network   # Cho phép reach etl_postgres (Option A)
    # Cho phép dùng host.docker.internal trên Linux (Option B)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  metabase_data:
    name: northwind_metabase_data

networks:
  analytics_net:
    name: analytics_network
    driver: bridge
  
  # Network của ETL repo — join để dùng Option A
  # Nếu chưa có (ETL repo chưa start) thì sẽ báo lỗi
  etl_network:
    external: true
    name: etl_network